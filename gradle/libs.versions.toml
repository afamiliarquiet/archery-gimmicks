[versions]
loom = "1.15.+"
mod-publish = "1.1.0"

minecraft = "26.1.2"
# https://fabricmc.net/develop/
fabric-loader = "0.18.6"
fabric-api = "0.145.4+26.1.2"

kaleido = "0.3.3+1.3.2"

switchy = "3.6.0+26.1"
modmenu = "18.0.0-alpha.8"
mcqoy = "0.4.1+fabric-26.1"
yacl = "3.9.3+26.1-fabric"
qomc = "1.0.0+26.1-fabric"

[plugins]
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
mod-publish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }

[libraries]
minecraft = { group = "mojang", name = "minecraft", version.ref = "minecraft" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }

kaleido = { group = "folk.sisby", name = "kaleido-config", version.ref = "kaleido" }

switchy = { group = "maven.modrinth", name = "switchy", version.ref = "switchy" }
modmenu = { group = "com.terraformersmc", name = "modmenu", version.ref = "modmenu" }
mcqoy = { group = "maven.modrinth", name = "mcqoy", version.ref = "mcqoy" }
yacl = { group = "maven.modrinth", name = "yacl", version.ref = "yacl" }
qomc = { group = "maven.modrinth", name = "qomc", version.ref = "qomc" }

[bundles]
fabric = [ "fabric-loader", "fabric-api" ]
